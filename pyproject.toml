[project]
name = "learn-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=5.1.0",
    "ipython>=9.13.0",
    "ipywidgets>=8.1.8",
    "keras>=3.14.1",
    "matplotlib>=3.10.9",
    "matplotlib-inline>=0.2.2",
    "mlxtend>=0.25.0",
    "notebook>=7.5.6",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pyg-lib>=0.6.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tensorboard>=2.21.0",
    "tokenizers>=0.23.3",
    "torch>=2.12.0",
    "torch-geometric>=2.8.1",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "torch-tb-profiler>=0.4.3",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.27.0",
    "tqdm>=4.68.3",
]

[tool.uv]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# PyG 扩展算子 (pyg_lib / torch_scatter / torch_sparse) 的预编译 wheel 站。
# 这个 flat 索引只包含上面三个包，torch-geometric 本体仍来自 PyPI。
# URL 里的 torch 版本号必须与上面 torch 的版本严格一致，升级 torch 后要同步改。
[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.12.0+cu126.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
pyg-lib = { index = "pyg" }
torch-scatter = { index = "pyg" }
torch-sparse = { index = "pyg" }

[tool.pyright]
extraPaths = [".", 
"pytorch/08_pytorch_paper_replicating",
"pytorch/08_pytorch_paper_replicating/going_modular"]
